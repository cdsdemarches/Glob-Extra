<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Glob'Extra">
  <defs>
    <!-- Fond : bleu nuit, dégradé diagonal -->
    <linearGradient id="ge-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16345e"/>
      <stop offset="0.45" stop-color="#0a1f3d"/>
      <stop offset="1" stop-color="#050f1f"/>
    </linearGradient>

    <!-- Marque : corail, dégradé haut-gauche vers bas-droite -->
    <linearGradient id="ge-mark" x1="0.12" y1="0.08" x2="0.88" y2="0.92">
      <stop offset="0" stop-color="#ff9478"/>
      <stop offset="0.5" stop-color="#ff6b4a"/>
      <stop offset="1" stop-color="#d1431f"/>
    </linearGradient>

    <!-- Halo corail discret, comme sur le fond du site -->
    <radialGradient id="ge-glow" cx="0.72" cy="0.26" r="0.62">
      <stop offset="0" stop-color="#ff6b4a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff6b4a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Carré arrondi -->
  <rect width="512" height="512" rx="112" fill="url(#ge-bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#ge-glow)"/>

  <!-- Liseré intérieur -->
  <rect x="27" y="27" width="458" height="458" rx="90"
        fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Traits de vitesse, à droite de la flèche -->
  <g fill="#050f1f" fill-opacity="0.55">
    <rect x="446" y="183" width="40" height="11" rx="5.5"/>
    <rect x="446" y="250.5" width="40" height="11" rx="5.5"/>
    <rect x="446" y="318" width="40" height="11" rx="5.5"/>
  </g>

  <!-- Arc ouvert (le « G »), ouverture à droite -->
  <path d="M 385.65 324.10 A 150 150 0 1 1 385.65 187.90"
        fill="none" stroke="url(#ge-mark)" stroke-width="58" stroke-linecap="round"/>

  <!-- Reflet sur la partie haute de l'arc -->
  <path d="M 135.3 139.3 A 165 165 0 0 1 368.7 139.3"
        fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="8" stroke-linecap="round"/>

  <!-- Flèche traversant l'ouverture -->
  <path d="M 206 227 H 335 V 196 L 434 256 L 335 316 V 285 H 206 Z"
        fill="url(#ge-mark)"/>
</svg>
